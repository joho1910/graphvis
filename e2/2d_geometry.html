<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2D Geometrie aus Linien</title>
</head>
<body style="background-color: lavenderblush; font-family: 'Trebuchet MS', Helvetica, sans-serif;">
<div style="display: flex; align-items: start; justify-content: space-between; flex-direction: column">
    <canvas id="canvas" width="850" height="850"></canvas>
    <script>
        // Get the WebGL context.
        var canvas = document.getElementById('canvas');
        var gl = canvas.getContext('experimental-webgl');

        // Pipeline setup.
        gl.clearColor(0, 0, 0, 0);
        // Backface culling.
        gl.frontFace(gl.CCW);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        //gl.cullFace(gl.FRONT);

        // Compile vertex shader.
        var vsSource = 'attribute vec2 pos;' +
            'void main(){ gl_Position = vec4(pos*0.03, 0, 1); }';
        var vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);

        // Compile fragment shader.
        fsSouce = 'void main() { gl_FragColor = vec4(0,0,0,1); }';
        var fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSouce);
        gl.compileShader(fs);

        // Link shader together into a program.
        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);

        // Vertex data.
        var vertices = new Float32Array([
            -27, 29,   // 0
            -26, 14,   // 1
            -25, 17,   // 2
            -25, 23,   // 3
            -24, 15,   // 4
            -24, 25,   // 5
            -23, 25,   // 6
            -23, 27,   // 7
            -22, 12,   // 8
            -22, 22,   // 9
            -20, 6,    // 10
            -19, -24,  // 11
            -19, 27,   // 12
            -18, -27,  // 13
            -18, 14,   // 14
            -17, -23,  // 15
            -17, -16,  // 16
            -17, 25,   // 17
            -16, 20,   // 18
            -15, -25,  // 19
            -14, -27,  // 20
            -14, -4,   // 21
            -14, 27,   // 22
            -12, -29,  // 23
            -12, -24,  // 24
            -12, -13,  // 25
            -10, -17,  // 26
            -9, -7,    // 27
            -8, 22,    // 28
            -7, -23,   // 29
            -7, 15,    // 30
            -1, -29,   // 31
            -1, 9,     // 32
            1, -2,     // 33
            2, -29,    // 34
            2, -14,    // 35
            9, 4,      // 36
            10, -29,   // 37
            14, -22,   // 38
            14, -10,   // 39
            17, -24,   // 40
            19, -14,   // 41
            19, -8,    // 42
            22, -29,   // 43
            22, -23,   // 44
            22, -13,   // 45
            26, -5,    // 46
            27, -22    // 47
        ]);

        // Index data.
        var indices = new Uint16Array([
            0, 12,
            0, 5,
            5, 6,
            6, 7,
            7, 17,
            17, 22,
            22, 12,
            6, 9,
            9, 17,
            5, 3,
            3, 9,
            3, 2,
            2, 9,
            2, 1,
            1, 4,
            4, 2,
            1, 8,
            8, 4,
            8, 14,
            14, 9,
            9, 18,
            18, 14,
            18, 17,
            18, 22,
            22, 28,
            28, 14,
            14, 30,
            30, 28,
            30, 10,
            10, 8,
            10, 21,
            21, 30,
            30, 32,
            32, 21,
            21, 33,
            33, 32,
            32, 36,
            36, 35,
            35, 33,
            35, 27,
            27, 21,
            21, 16,
            16, 25,
            25, 27,
            25, 35,
            35, 39,
            39, 36,
            39, 38,
            38, 35,
            35, 29,
            29, 26,
            26, 25,
            26, 24,
            24, 29,
            24, 19,
            19, 20,
            20, 13,
            13, 11,
            11, 15,
            15, 16,
            20, 23,
            23, 29,
            23, 31,
            31, 29,
            31, 34,
            34, 35,
            34, 38,
            34, 37,
            38, 37,
            37, 43,
            43, 40,
            40, 38,
            43, 47,
            47, 45,
            45, 46,
            46, 42,
            42, 45,
            42, 41,
            41, 44,
            44, 40,
            44, 47
        ]);

        // Setup vertex buffer object.
        var vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        // Connect vertex buffer to attribute variable.
        var posAttrib = gl.getAttribLocation(prog, 'pos');
        gl.vertexAttribPointer(posAttrib, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(posAttrib);

        // Setup index buffer object.
        var ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices,
            gl.STATIC_DRAW);
        ibo.numerOfEmements = indices.length;

        // Clear framebuffer and render primitives.
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawElements(gl.LINES, ibo.numerOfEmements,
            gl.UNSIGNED_SHORT, 0);
    </script>

</div>
</body>
</html>
