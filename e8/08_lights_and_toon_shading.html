<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>Lichter auf einer Kreisbahn mit Toon Shading</title>
	<link rel="stylesheet" href="08_lights_and_toon_shading.css">

    <script src="../ext/gl-matrix.js"></script>
    <script src="08_vertexData_plane.js"></script>
    <script src="08_vertexData_sphere.js"></script>
    <script src="08_vertexData_torus.js"></script>
    <script src="08_lights_and_toon_shading.js"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute vec3 aPosition;
        attribute vec3 aNormal;

        uniform mat4 uPMatrix;
        uniform mat4 uMVMatrix;
        uniform mat3 uNMatrix;

        varying vec3 vPosition;
        varying vec3 vNormal;
        varying vec3 vView;

        varying vec4 vColor;

        // Ambient light.
        uniform vec3 ambientLight;

        // Pointlights.
        const int MAX_LIGHT_SOURCES = 2;
        struct LightSource {
            bool isOn;
            vec3 position;
            vec3 color;
        };
        uniform LightSource light[MAX_LIGHT_SOURCES];

        // Material.
        struct PhongMaterial {
            vec3 ka;
            vec3 kd;
            vec3 ks;
            float ke;
        };
        uniform PhongMaterial material;

        void main(){
            // Calculate vertex position in eye coordinates.
            vec4 tPosition = uMVMatrix * vec4(aPosition, 1.0);

            // Calculate projection.
            gl_Position = uPMatrix * tPosition;

            // vec3 tNormal = normalize(uNMatrix * aNormal);

            // Calculate view vector.
            //vec3 v = normalize(-tPosition.xyz);

            //vColor = vec4( phong(tPosition.xyz, tNormal, v), 1.0);

            vPosition = tPosition.xyz;
            vNormal = normalize(uNMatrix * aNormal);

            vView = normalize(-tPosition.xyz);

        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        precision mediump float;

		varying vec3 vPosition;
		varying vec3 vNormal;
		varying vec3 vView;

		// Ambient light
		uniform vec3 ambientLight;

		// Pointlights.
		const int MAX_LIGHT_SOURCES = 2;
		struct LightSource {
			bool isOn;
			vec3 position;
			vec3 color;
		};
		uniform LightSource light[MAX_LIGHT_SOURCES];

		// Material.
		struct PhongMaterial {
			vec3 ka;
			vec3 kd;
			vec3 ks;
			float ke;
		};
		uniform PhongMaterial material;

		// Enable/disable toon shading.
		uniform bool uToonShading;

		// Phong illumination for single light source,
        // no ambient light.
        vec3 phong(vec3 p, vec3 n, vec3 v, LightSource l) {
            vec3 L = l.color;

            vec3 s = normalize(l.position - p);
            vec3 r = reflect(-s, n);

            float sn = max( dot(s,n), 0.0);
            float rv = max( dot(r,v), 0.0);

            vec3 diffuse = material.kd * L * sn;
            vec3 specular = material.ks * L * pow(rv, material.ke);

            // Toon shading.
        	if (uToonShading) {
        		float toonIntensity;

        		if (sn < 0.25) {
        			toonIntensity = 0.25;
        		} else if (sn < 0.5) {
        			toonIntensity = 0.5;
        		} else if (sn < 0.75) {
        			toonIntensity = 0.75;
        		} else {
        			toonIntensity = 1.0;
        		}

        		diffuse = material.kd * L * toonIntensity;

      	  		if (rv > 0.8) {
      			  	specular = material.ks * L;
        		} else {
					specular = vec3(0.0);
        		}
      	  	}

     	   	return diffuse + specular;
        }

		// Phong illumination for multiple light sources
        vec3 phong(vec3 p, vec3 n, vec3 v) {

            // Calculate ambient light.
            vec3 result = material.ka * ambientLight;

            // Add light from all light sources.
            for(int j=0; j < MAX_LIGHT_SOURCES; j++){
                if(light[j].isOn){
                    result += phong(p, n, v, light[j]);
                }
            }
            return result;
        }

        varying vec4 vColor;

        void main() {
        	vec3 n = normalize(vNormal);
        	vec3 v = normalize(vView);

        	vec3 color = phong(vPosition, n, v);

        	// Outlines.
        	if (uToonShading) {
        		float outline = dot(v, n);

        		if (outline < 0.25) {
        			color = vec3(0.0, 0.0, 0.0);
        		}
        	}

            gl_FragColor = vec4(color, 1.0);
        }
    </script>
</head>
<body onload="app.start()">
<canvas id="canvas" width="500" height="500"></canvas>
</body>
</html>
