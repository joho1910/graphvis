<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Objekte bewegen - fliegende Kugeln</title>
    <link rel="stylesheet" href="06_moving_objects.css">

    <script src="../ext/gl-matrix.js"></script>
    <script src="06_vertexData_sphere.js"></script>
    <script src="06_vertexData_torus.js"></script>
    <script src="06_vertexData_plane.js"></script>
    <script src="06_moving_objects.js"></script>
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute vec3 aPosition;
        attribute vec3 aNormal;

        uniform mat4 uPMatrix;
        uniform mat4 uMVMatrix;

        uniform mat3 uNMatrix;

        varying vec4 vColor;
        uniform vec4 uColor;

        void main(){
        gl_Position = uPMatrix * uMVMatrix * vec4(aPosition, 1.0);

        vec3 tNormal = uNMatrix * aNormal;

        vColor = vec4(tNormal.z, tNormal.z, tNormal.z, 1.0);
        vColor = uColor * (vColor + 1.0) / 2.0;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        precision mediump float;
        varying vec4 vColor;

        void main() {
        gl_FragColor = vColor;
        }
    </script>
</head>
<body onload="app.start()">
<div id="content-wrapper">
    <h1>Objekte bewegen - fliegende Kugeln</h1>
    <canvas id="canvas" width="750" height="750"></canvas>
    <p>Zum Abspielen der Bewegung <b>K</b> oder <b>K + Shift</b> gedrückt halten.</p>
</div>

</body>
</html>
