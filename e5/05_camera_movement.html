<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kamerabewegung</title>
    <link rel="stylesheet" href="05_camera_movement.css">

    <script src="../ext/gl-matrix.js"></script>
    <script src="05_vertexData_cone.js"></script>
    <script src="05_vertexData_torus.js"></script>
    <script src="05_vertexData_recursiveSphere.js"></script>
    <script src="05_vertexData_plane.js"></script>
    <script src="05_camera_movement.js" defer></script>
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute vec3 aPosition;
			attribute vec3 aNormal;

			uniform mat4 uPMatrix;
			uniform mat4 uMVMatrix;

			varying vec4 vColor;

			void main(){
				gl_Position = uPMatrix * uMVMatrix * vec4(aPosition, 1.0);

				vColor = vec4(aNormal.x, aNormal.y, aNormal.z, 1.0);
				vColor = (vColor + 1.0) / 2.0;
			}
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        precision mediump float;
			varying vec4 vColor;

			void main() {
				gl_FragColor = vColor;
			}
    </script>
</head>
<body onload="app.start()">
<div id="content-wrapper">
    <h1>Kamerabewegung</h1>
    <canvas id="canvas" width="650" height="650"></canvas>
    <div id="recursionSliderWrapper" style="margin-top:8px">
        <label for="recursionLevelSlider">Rekursionslevel:</label>
        <input type="range" id="recursionLevelSlider" min="0" max="6" step="1" value="2">
        <span id="recursionValue">2</span>
        <div style="width: auto"></div>
        <span style="font-size:10px;">
            (<a href="http://blog.andreaskahler.com/2009/06/creating-icosphere-mesh-in-code.html" target="_blank">Vorlage für die Sphären-Implementierung</a>)
        </span>
    </div>

    <div>
        <p style="margin-bottom:5px"><b>Bewegungssteuerung</b>:</p>
        <ul style="margin-top:0; margin-bottom:0;">
            <li><b>←-Taste</b>: Drehen im Uhrzeigersinn.</li>
            <li><b>→-Taste</b>: Drehen entgegen dem Uhrzeigersinn.</li>
            <li><b>N / N-Shift</b>: Radius ändern.</li>
            <li><b>Y / Y-Shift</b>: Kamera nach unten/oben bewegen.</li>
        </ul>
    </div>
</div>
</body>
</html>
